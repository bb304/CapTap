# CapTap local stack — PostgreSQL (+ optional API container)
#
# Default: database only (dotnet run for API during day-to-day development)
#   docker compose up -d
#
# Full stack (API container + Postgres):
#   docker compose --profile full up -d --build
#
# Production-like secrets must come from env / Secrets Manager — never commit real values.

services:
  postgres:
    image: postgres:16
    container_name: captap-postgres
    environment:
      POSTGRES_USER: captap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-captappassword}
      POSTGRES_DB: captapdb
    ports:
      - "5432:5432"
    volumes:
      - captap-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captap -d captapdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: server/CapTap.Api/Dockerfile
    image: captap-api:local
    container_name: captap-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CAPTAP_API_PORT:-5001}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DATABASE_CONNECTION: Host=postgres;Port=5432;Database=captapdb;Username=captap;Password=${POSTGRES_PASSWORD:-captappassword}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-secret}
      JWT_ISSUER: ${JWT_ISSUER:-CapTap}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-CapTapMobile}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-Mock}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CapTap}
      EMAIL_APP_BASE_URL: ${EMAIL_APP_BASE_URL:-http://localhost:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

volumes:
  captap-data:
