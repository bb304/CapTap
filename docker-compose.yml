services:
  postgres:
    image: postgres:16
    container_name: captap-postgres
    environment:
      POSTGRES_USER: captap
      POSTGRES_PASSWORD: captappassword
      POSTGRES_DB: captapdb
    ports:
      - "5432:5432"
    volumes:
      - captap-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captap -d captapdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  captap-data:
