name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CapTap.sln

      - name: Format check
        run: dotnet format CapTap.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build CapTap.sln --configuration Release --no-restore

      - name: Test + coverage
        run: >
          dotnet test CapTap.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ../artifacts/coverage/backend
          --logger "trx;LogFileName=backend.trx"
        env:
          # Testcontainers needs Docker on the runner (available on ubuntu-latest).
          DOTNET_ENVIRONMENT: Development

      - name: Vulnerable package scan (informational)
        continue-on-error: true
        run: |
          dotnet list CapTap.sln package --vulnerable --include-transitive 2>&1 | tee ../artifacts/backend-vulns.txt
          if grep -qi "has the following vulnerable packages" ../artifacts/backend-vulns.txt; then
            echo "::warning::Vulnerable NuGet packages detected. Review artifacts/backend-vulns.txt"
          fi

      - name: Upload backend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci
          path: |
            artifacts/coverage/backend
            artifacts/backend-vulns.txt
          if-no-files-found: ignore

  mobile:
    name: Mobile (lint, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test + coverage
        run: npm run test:ci

      - name: Upload mobile coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: ignore

  docker:
    name: Docker API image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/CapTap.Api/Dockerfile
          push: false
          tags: captap-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
